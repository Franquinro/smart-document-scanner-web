<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="所有影像都在瀏覽器本機處理的智慧文件掃描器">
  <title>頁淨・智慧文件掃描器</title><link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<header><div><span class="brand-mark">▱</span><b>頁淨</b><small>智慧文件掃描器</small></div><div id="cvStatus" class="status waiting"><i></i> OpenCV 載入中</div></header>
<main>
  <aside class="pages-panel">
    <div class="panel-title"><div><b>頁面</b><span id="pageCount">0 頁</span></div><label class="icon-btn" title="加入照片">＋<input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></label></div>
    <section id="dropZone" class="drop-zone"><span>⇧</span><b>拖放照片到這裡</b><small>或點擊選取 JPG、PNG、WebP</small></section>
    <ol id="pageList" aria-label="掃描頁面"></ol>
    <p class="privacy">🔒 照片只在你的瀏覽器中處理，不會上傳</p>
  </aside>

  <section class="workspace">
    <div id="emptyState"><div class="empty-art">⌑</div><h1>把文件照片變成乾淨掃描檔</h1><p>加入一張或多張照片，系統會自動找出紙張邊緣。</p><button class="primary" id="emptyAdd">選取照片</button></div>
    <div id="editor" hidden>
      <div class="editor-toolbar"><div><button id="rotateLeft" title="向左旋轉">↶</button><button id="rotateRight" title="向右旋轉">↷</button><button id="autoDetect">✦ 重新偵測</button></div><span id="detectBadge"></span></div>
      <div class="canvas-grid"><div class="canvas-card"><span class="caption">調整四角</span><div id="canvasWrap"><canvas id="sourceCanvas"></canvas><canvas id="overlayCanvas"></canvas></div><p>拖曳透明控制環；可點按環內或附近區域</p></div><div class="canvas-card"><span class="caption">即時預覽</span><div class="preview-wrap"><canvas id="previewCanvas"></canvas></div><p id="previewInfo">—</p></div></div>
    </div>
    <div id="busy" hidden><span class="spinner"></span><b>處理中…</b></div>
    <div id="errorBox" hidden role="alert"></div>
  </section>

  <aside class="settings-panel">
    <div class="panel-title"><b>影像調整</b><button id="resetSettings">重設</button></div>
    <label>輸出模式<select id="mode"><option value="color">彩色</option><option value="gray">灰階</option><option value="document">文件黑白</option></select></label>
    <div id="sliders"></div>
    <label class="check"><input id="whiten" type="checkbox" checked><span>白紙去灰</span></label>
    <hr><h3>匯出</h3>
    <label>PDF 檔名<input id="pdfName" value="掃描文件" maxlength="80"></label>
    <label>輸出解析度<select id="dpi"><option>150</option><option selected>300</option><option>600</option></select></label>
    <button id="downloadJpg" class="secondary" disabled>下載此頁 JPG</button><button id="exportPdf" class="primary" disabled>匯出多頁 PDF</button>
  </aside>
</main>
<footer>離線優先 · 無帳號 · 無上傳</footer>
<script src="https://docs.opencv.org/4.x/opencv.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script type="module" src="app.js"></script>
</body></html>
